name: CoinGlass BTC long-short alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - uses: actions/cache@v4
        with:
          path: ls_state.json
          key: ls-state-${{ github.run_id }}
          restore-keys: ls-state-

      - name: Check BTC long/short %
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_APIKEY: ${{ secrets.WA_APIKEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python coinglass_ls_alerts.py --once
